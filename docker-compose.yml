# ============================================================
# Docker Compose — SCDS Development Environment
# ============================================================
# This file defines three services that together form the
# complete development stack:
#
#   1. postgres  — The PostgreSQL 17 database
#   2. backend   — The Express.js API server
#   3. frontend  — The Vite/React development server
#
# Services communicate over a shared Docker bridge network.
# Inside this network, each service is reachable by its name
# (e.g., the backend connects to "postgres" not "localhost").
#
# Usage:
#   docker compose up --build    # Build and start everything
#   docker compose down          # Stop everything
#   docker compose down -v       # Stop and delete DB data
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 17 Database
  # ----------------------------------------------------------
  # This container runs the project's PostgreSQL instance.
  # Data is persisted in a Docker named volume so it survives
  # container restarts. To wipe the database, use:
  #   docker compose down -v
  # ----------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: scds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scds}
      POSTGRES_USER: ${POSTGRES_USER:-scds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_strong_password}
    ports:
      # Expose PostgreSQL on the host so you can connect with
      # tools like pgAdmin, DBeaver, or psql from your machine.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume for persistent database storage
      - postgres_data:/var/lib/postgresql/data
      # Mount the database directory so SQL files can be run
      # inside the container using psql.
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scds_user} -d ${POSTGRES_DB:-scds}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Express.js Backend API
  # ----------------------------------------------------------
  # Runs the Node.js/Express backend with hot-reload enabled
  # via tsx --watch. Source code is bind-mounted so changes
  # on your host are reflected instantly in the container.
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scds-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-scds}
      POSTGRES_USER: ${POSTGRES_USER:-scds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_strong_password}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_random_secret_key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # Bind-mount source code for hot-reload during development.
      # node_modules is in a separate anonymous volume so the
      # container uses its own installed packages, not the host's.
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------
  # Vite + React Frontend
  # ----------------------------------------------------------
  # Runs the Vite dev server with HMR (Hot Module Replacement).
  # The --host flag makes it accessible from outside the
  # container (required for Docker port mapping to work).
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scds-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

# Named volumes persist data across container restarts
volumes:
  postgres_data:
    driver: local
